<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGROTEXTILES - Soluciones Plásticas de Polipropileno</title>
    <style>
        /* RESET & BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #334155;
            line-height: 1.6;
        }

        /* HEADER / NAVEGACIÓN */
        .top-header {
            background-color: #0f172a;
            border-bottom: 1px solid #1e293b;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: #f97316; /* Naranja corporativo */
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #10b981;
        }

        /* HERO SECTION */
        .hero {
            background: linear-gradient(135deg, #0b1329 0%, #0f172a 100%);
            color: #ffffff;
            padding: 80px 5%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
            min-height: 480px;
        }

        .hero-content h1 {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .hero-content p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 35px;
            max-width: 540px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-green {
            background-color: #10b981;
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: background-color 0.2s;
            border: none;
            display: inline-block;
        }

        .btn-green:hover {
            background-color: #059669;
        }

        .btn-blue {
            background-color: #2563eb;
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: background-color 0.2s;
            border: none;
            display: inline-block;
        }

        .btn-blue:hover {
            background-color: #1d4ed8;
        }

        .hero-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .hero-card h3 {
            color: #38bdf8;
            font-size: 1.3rem;
            margin-bottom: 12px;
        }

        .hero-card p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* SECCIÓN LÍNEAS DE PRODUCCIÓN */
        .section-production {
            padding: 70px 5%;
            text-align: center;
            background-color: #ffffff;
        }

        .section-title {
            font-size: 1.9rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 10px;
        }

        .section-subtitle {
            color: #64748b;
            font-size: 1.05rem;
            margin-bottom: 45px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .card-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 30px;
            text-align: left;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }

        .card-box h3 {
            font-size: 1.2rem;
            color: #0f172a;
            margin-bottom: 12px;
        }

        .card-box p {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .card-box a {
            color: #10b981;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
        }
